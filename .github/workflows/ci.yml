name: ci
on:
  push: {branches: [main]}
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix: {python: ["3.11", "3.12", "3.13"]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}"}
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q
  bench-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e .
      - run: python bench/bench.py --n 300 --out bench-ci.md
      - run: cat bench-ci.md >> "$GITHUB_STEP_SUMMARY"
  evals-demo:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e .
      - name: Run eval suite against mock models through the gateway
        run: |
          llm-mock-provider --host 127.0.0.1 --port 9000 &
          sed 's#mock-primary:9000#127.0.0.1:9000#; s#mock-secondary:9000#127.0.0.1:9000#' config/mock.yaml > /tmp/mock.yaml
          llm-gateway --config /tmp/mock.yaml --port 8080 &
          for i in $(seq 50); do curl -fs localhost:8080/healthz && break; sleep 0.2; done
          llm-eval run --suite evals/suites/basic.yaml --models smart,sloppy --base-url http://localhost:8080/v1 --out reports
          cat reports/basic.md >> "$GITHUB_STEP_SUMMARY"
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t llm-gateway:ci .
      - name: Image runs as non-root and serves /healthz
        run: |
          test "$(docker run --rm --entrypoint id llm-gateway:ci -u)" = "10001"
          docker run -d --name gw -p 8080:8080 llm-gateway:ci --config /app/config/mock.yaml
          for i in $(seq 50); do curl -fs localhost:8080/healthz && break; sleep 0.2; done
          curl -fs localhost:8080/healthz
      - name: Validate Kubernetes manifests
        run: |
          kubectl kustomize deploy/k8s > /tmp/all.yaml
          docker run --rm -v /tmp:/w ghcr.io/yannh/kubeconform:latest -strict -summary \
            -ignore-missing-schemas /w/all.yaml
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --no-banner --redact -v .
